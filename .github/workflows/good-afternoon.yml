name: Good afternoon

# Sends a Pushover notification at 2:30pm UK time, every day.
#
# GitHub's scheduler only speaks UTC, and the UK switches between GMT and BST,
# so 2:30pm London is 13:30 UTC in summer and 14:30 UTC in winter. Rather than
# editing this file twice a year, we wake up for both possibilities and let the
# job itself decide which one is the real 2:30pm.
#
# The times are :25 rather than :30 because GitHub runs scheduled jobs late --
# a few minutes usually, longer when the runners are busy. Starting five
# minutes early means the message tends to land around the right time.

on:
  schedule:
    - cron: "25 13 * * *"   # 2:25pm London while BST is in effect
    - cron: "25 14 * * *"   # 2:25pm London while GMT is in effect
  workflow_dispatch:        # the "Run workflow" button, for testing at any hour

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Is it actually the afternoon in London?
        id: check
        run: |
          hour=$(TZ=Europe/London date +%H)
          local_time=$(TZ=Europe/London date +"%H:%M %Z")

          # The button should always send, whatever the clock says.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered by hand at $local_time -- sending."
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only one of the two scheduled runs lands in the 2pm hour London-side;
          # the other is the wrong half of the year and stops here.
          if [ "$hour" = "14" ]; then
            echo "It is $local_time in London -- sending."
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "It is $local_time in London, not the 2pm hour -- skipping."
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the notification
        if: steps.check.outputs.send == 'true'
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          if [ -z "$PUSHOVER_TOKEN" ] || [ -z "$PUSHOVER_USER" ]; then
            echo "::error::Missing PUSHOVER_TOKEN or PUSHOVER_USER."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # --form-string (not -F) so a value starting with @ or < is sent
          # literally instead of being read as a filename.
          curl --silent --show-error --fail-with-body \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=Good afternoon" \
            --form-string "message=Good afternoon! It's half past two." \
            https://api.pushover.net/1/messages.json
          echo
